[project]
name = "craftpilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "litemapy>=0.11.0b0",
    "numpy>=2.5.3",
    "openai>=3.16.2",
    "pillow>=12.3.0",
    "pydantic>=2",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "trimesh>=5.1.0",
    "typer>=0.27.2",
    "uvicorn>=0.53.0",
]

[project.scripts]
craftpilot = "craftpilot:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
