description: >
  A single storey East Asian temple hall. A wide hip roof with a concave profile and eave corners
  that sweep upward, a two block overhang on rafter ends, dark oak posts and beams on white plaster
  walls, a red accent, a spire finial, and a stone plinth with lamp posts on the approach.
tags: [temple, shrine, japanese, chinese, asian, hall, tea, house, dojo, pavilion, zen, curved, roof]
program:
  label: east asian temple hall
  bounds: {width: 29, height: 22, depth: 23}
  parts:
    - name: hall
      shape: rect
      size: {width: 0.85, depth: 0.8}
      floors: 1
      floor_height: 6
      roof: {type: hip, pitch: 1.0, overhang: 2, profile: concave, curl: 2.0, edge_width: 1, edge_lines: hips}
  facade:
    bay_width: {min: 3, max: 3}
    window: plain
    window_width: 1
    window_height: 2
    shutters: 0.0
    sills: false
    framing: tudor
    symmetry: true
    max_flat_run: 4
    entrance: double
    lamp_posts: true
  depth:
    frame_protrude: 1
    window_inset: 0
    eave_trim: true
    foundation_rise: 2
    foundation_outset: 2
    corbels: true
    detail: 0.15
    foliage: 0.25
    string_courses: false
    quoins: false
  attachments:
    - {kind: spire, count: 1, params: {height: 3}}
  budget: {dominant: 1, medium_min: 0, medium_max: 0, small_min: 0, small_max: 0}
  palette:
    roof_edge:
      families: [{family: spruce, weight: 1.0}]
      texture_rate: 0.1
    primary:
      families: [{family: white_concrete, weight: 0.85}, {family: calcite, weight: 0.15}]
      texture_rate: 0.12
      weathering: 0.0
    framing:
      families: [{family: dark_oak, weight: 1.0}]
    roof:
      families: [{family: dark_oak, weight: 1.0}, {family: spruce, weight: 0.6}]
      gradient: vertical
      texture_rate: 0.1
      weathering: 0.2
    trim:
      families: [{family: dark_oak, weight: 1.0}]
    foundation:
      families: [{family: polished_andesite, weight: 0.7}, {family: andesite, weight: 0.3}]
      weathering: 0.3
      texture_rate: 0.25
    secondary:
      families: [{family: stone_bricks, weight: 1.0}]
    accent:
      families: [{family: red_concrete, weight: 1.0}]
    glass:
      families: [{family: glass, weight: 1.0}]
