[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-copilot"
version = "0.1.0"
description = "CAD-style agentic Minecraft build engine (HTN26)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pillow>=10",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "openai>=1.30",
  "httpx>=0.27",
  "pydantic>=2",
  "litemapy>=0.9",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["copilot*", "mock_mod*"]

[tool.setuptools.package-data]
copilot = ["prompts/*.md", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
